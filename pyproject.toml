[project]
name = "arxiv-daily-digest"
version = "0.1.0"
description = "Daily arXiv digest pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["arxiv-catchup", "arxiv-interest-sort", "arxiv-summarizer"]

[dependency-groups]
dev = ["ruff", "pytest"]

[tool.uv.sources]
arxiv-catchup = { workspace = true }
arxiv-interest-sort = { workspace = true }
arxiv-summarizer = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
src = ["packages/arxiv-catchup/src", "packages/arxiv-interest-sort/src"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src", "tests"]


