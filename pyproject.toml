[project]
name = "arxiv-daily-digest"
version = "0.1.0"
description = "Daily arXiv digest pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "arxiv-fetcher",
    "arxiv-summarizer",
    "sentence-transformers>=5.5.1",
]

[tool.uv.sources]
arxiv-fetcher = { workspace = true }
arxiv-summarizer = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]
