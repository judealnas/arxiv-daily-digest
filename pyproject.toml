[project]
name = "arxiv-daily-digest"
version = "0.1.0"
description = "Daily arXiv digest pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "arxiv-catchup",
    "arxiv-summarizer",
    "sentence-transformers>=5.5.1",
]

[tool.uv.sources]
arxiv-catchup = { workspace = true }
arxiv-summarizer = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
src = ["packages/arxiv-catchup/src", "packages/arxiv-summarizer/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "ruff>=0.15.18",
]
