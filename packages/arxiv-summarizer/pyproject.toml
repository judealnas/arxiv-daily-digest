[project]
name = "arxiv-summarizer"
version = "0.1.0"
description = "Batch LLM summarizer — chunk texts, call OpenAI-compatible APIs, emit JSONL results"
requires-python = ">=3.11"
dependencies = ["torch>=2.0", "transformers>=4.40"]

[project.scripts]
arxiv-summarize = "arxiv_summarizer.cli:console_main"

[tool.pytest.ini_options]
markers = [
    "slow: integration tests that load real model weights (deselect with -m 'not slow')",
]
