[project]
name = "arxiv-interest-sort"
version = "0.1.0"
description = "Sort arxiv papers using keywords and abstract"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.scripts]
arxiv-interest-sort = "arxiv_interest_sort.cli:main"

[project.optional-dependencies]
semantic = ["sentence-transformers>=3"]

[tool.uv]
dev-dependencies = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.format]
quote-style = "double"
